x-test-container: &test-container
  command: tail -f /dev/null
  # PID 1 ignores SIGTERM, without this every stop waits out the default 10s
  stop_grace_period: 1s

services:
  running-at-startup:
    <<: *test-container
    image: alpine:3.24.3@sha256:b3413572228e34bd1c9245f5565e6cd127005655e8a7899aef33d8e83255c9e6
    networks:
      - default
      - extra

  started-later:
    <<: *test-container
    image: alpine:3.24.3@sha256:b3413572228e34bd1c9245f5565e6cd127005655e8a7899aef33d8e83255c9e6

  stopped-later:
    <<: *test-container
    image: alpine:3.24.3@sha256:b3413572228e34bd1c9245f5565e6cd127005655e8a7899aef33d8e83255c9e6

  renamed-later:
    <<: *test-container
    image: alpine:3.24.3@sha256:b3413572228e34bd1c9245f5565e6cd127005655e8a7899aef33d8e83255c9e6

  connected-later:
    <<: *test-container
    image: alpine:3.24.3@sha256:b3413572228e34bd1c9245f5565e6cd127005655e8a7899aef33d8e83255c9e6

  docker-dns-rs:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DOMAIN: ${DOMAIN:?}
      RECORDS: "static-v4.example:10.1.2.3,static-v6.example:[fd00::1]"
    volumes:
      - type: bind
        source: "${DOCKER_SOCKET:-/var/run/docker.sock}"
        target: /var/run/docker.sock

networks:
  extra:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:1::/64
