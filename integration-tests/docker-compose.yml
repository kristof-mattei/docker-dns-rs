x-test-container: &test-container
  command: tail -f /dev/null
  # PID 1 ignores SIGTERM, without this every stop waits out the default 10s
  stop_grace_period: 1s

services:
  running-at-startup:
    <<: *test-container
    image: alpine@sha256:e7c4abb69531cb09e2a2bbb56fad3367ab694865c49df898c1c683185cc4376c
    networks:
      - default
      - extra

  started-later:
    <<: *test-container
    image: alpine@sha256:e7c4abb69531cb09e2a2bbb56fad3367ab694865c49df898c1c683185cc4376c

  stopped-later:
    <<: *test-container
    image: alpine@sha256:e7c4abb69531cb09e2a2bbb56fad3367ab694865c49df898c1c683185cc4376c

  renamed-later:
    <<: *test-container
    image: alpine@sha256:e7c4abb69531cb09e2a2bbb56fad3367ab694865c49df898c1c683185cc4376c

  connected-later:
    <<: *test-container
    image: alpine@sha256:e7c4abb69531cb09e2a2bbb56fad3367ab694865c49df898c1c683185cc4376c

  docker-dns-rs:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DOMAIN: ${DOMAIN:?}
      RECORDS: "static-v4.example:10.1.2.3,static-v6.example:[fd00::1]"
    volumes:
      - type: bind
        source: "${DOCKER_SOCKET:-/var/run/docker.sock}"
        target: /var/run/docker.sock

networks:
  extra:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:1::/64
