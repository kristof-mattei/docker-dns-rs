x-test-container: &test-container
  command: tail -f /dev/null
  # PID 1 ignores SIGTERM, without this every stop waits out the default 10s
  stop_grace_period: 1s

services:
  running-at-startup:
    <<: *test-container
    image: alpine:3.24.3@sha256:1b7232cda4ca3dc20b5d1247bdc9bfb631f2661d15d323bdd6fccc035ed1a9e7
    networks:
      - default
      - extra

  started-later:
    <<: *test-container
    image: alpine:3.24.3@sha256:1b7232cda4ca3dc20b5d1247bdc9bfb631f2661d15d323bdd6fccc035ed1a9e7

  stopped-later:
    <<: *test-container
    image: alpine:3.24.3@sha256:1b7232cda4ca3dc20b5d1247bdc9bfb631f2661d15d323bdd6fccc035ed1a9e7

  renamed-later:
    <<: *test-container
    image: alpine:3.24.3@sha256:1b7232cda4ca3dc20b5d1247bdc9bfb631f2661d15d323bdd6fccc035ed1a9e7

  connected-later:
    <<: *test-container
    image: alpine:3.24.3@sha256:1b7232cda4ca3dc20b5d1247bdc9bfb631f2661d15d323bdd6fccc035ed1a9e7

  docker-dns-rs:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DOMAIN: ${DOMAIN:?}
      RECORDS: "static-v4.example:10.1.2.3,static-v6.example:[fd00::1]"
    volumes:
      - type: bind
        source: "${DOCKER_SOCKET:-/var/run/docker.sock}"
        target: /var/run/docker.sock

networks:
  extra:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:1::/64
