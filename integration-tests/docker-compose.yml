x-test-container: &test-container
  command: tail -f /dev/null
  # PID 1 ignores SIGTERM, without this every stop waits out the default 10s
  stop_grace_period: 1s

services:
  running-at-startup:
    <<: *test-container
    image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    networks:
      - default
      - extra

  started-later:
    <<: *test-container
    image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a

  stopped-later:
    <<: *test-container
    image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a

  renamed-later:
    <<: *test-container
    image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a

  connected-later:
    <<: *test-container
    image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a

  docker-dns-rs:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DOCKER_DNS_RS_DOMAIN: ${DOMAIN:?}
      DOCKER_DNS_RS_RECORDS: "static-v4.example:10.1.2.3,static-v6.example:[fd00::1]"
    volumes:
      - type: bind
        source: "${DOCKER_SOCKET:-/var/run/docker.sock}"
        target: /var/run/docker.sock

networks:
  extra:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:1::/64
